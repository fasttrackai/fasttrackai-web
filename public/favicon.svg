  <rect width="32" height="32" rx="8" fill="#8B27DF" />
  
  <!-- White Rocket -->
  <g transform="translate(7, 7) scale(0.9)" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 5C20 5 15 5 10 10C5 15 5 20 5 20L10 25C10 25 15 25 20 20C25 15 25 10 25 10L20 5Z" />
    <path d="M5 20L10 25L5 30L0 25L5 20Z" />
    <path d="M20 5L25 10L30 5L25 0L20 5Z" />
    <path d="M12.5 17.5L5 25" />
    <path d="M17.5 12.5L25 5" />
    <circle cx="17.5" cy="12.5" r="1.5" fill="white" stroke="none"/>
  </g>
  
  <!-- Gold Robot Head Circle -->
  <circle cx="24" cy="8" r="6" fill="#F59E0B" />
  
  <!-- Robot Head Icon -->
  <g transform="translate(21, 5) scale(0.3)" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="14" rx="2" />
    <circle cx="9" cy="12" r="2" />
    <circle cx="15" cy="12" r="2" />
    <line x1="8" y1="19" x2="16" y2="19" />
    <line x1="7" y1="3" x2="7" y2="5" />
    <line x1="17" y1="3" x2="17" y2="5" />
  </g>
  
  <!-- Subtle glow -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
</svg> 