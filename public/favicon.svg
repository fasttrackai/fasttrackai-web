<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background Circle -->
  <circle cx="16" cy="16" r="16" fill="#6a28b4" />
  
  <!-- Glow Effect -->
  <circle cx="16" cy="16" r="14" fill="url(#glow)" />
  
  <!-- Rocket Icon -->
  <g transform="translate(6, 6) scale(0.8)" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rocket parts with gold gradient -->
    <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z" stroke="url(#goldGradient)" />
    <path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z" stroke="url(#goldGradient)" />
    <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0" stroke="url(#goldGradient)" />
    <path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" stroke="url(#goldGradient)" />
    
    <!-- Purple accent dots -->
    <circle cx="17" cy="7" r="1" fill="#a855f7" stroke="none" />
    <circle cx="7" cy="17" r="0.8" fill="#a855f7" stroke="none" />
  </g>
  
  <!-- Gradients definitions -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#8a3dd9" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#5a1f99" stop-opacity="0" />
    </radialGradient>
    
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7d046" />
      <stop offset="100%" stop-color="#e5b012" />
    </linearGradient>
  </defs>
</svg> 