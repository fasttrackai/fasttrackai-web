    <line x1="7" y1="3" x2="7" y2="5" />
    <line x1="17" y1="3" x2="17" y2="5" />
  </g>
  
  <!-- Text: FastTrack -->
  <text x="90" y="48" font-family="'Inter', sans-serif" font-weight="400" font-size="36" fill="#000000" letter-spacing="-0.5px">fasttrack</text>
  
