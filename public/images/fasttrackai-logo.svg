  </g>
  
  <!-- Sparkle effect dots -->
  <circle cx="25" cy="25" r="0.8" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="45" cy="35" r="0.8" fill="#FFFFFF" opacity="0.7"/>
